<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>后台管理 - CryptoHub</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231652f0%22/><text x=%2216%22 y=%2222%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2218%22 font-weight=%22bold%22>C</text></svg>" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

    <div class="login-wrap">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon">C</div>
                <h1>CryptoHub 后台管理</h1>
                <p>登录管理资讯内容</p>
            </div>
            <form class="login-form" onsubmit="return doLogin(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" value="wladmin" placeholder="请输入用户名" />
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" />
                </div>
                <div class="login-error" id="loginError"></div>
                <button type="submit" id="loginBtn">登录</button>
            </form>
        </div>
    </div>

    <script>
        // Check if already logged in
        const token = localStorage.getItem("admin_token");
        if (token) {
            window.location.href = "dashboard.html";
        }

        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            const errEl = document.getElementById("loginError");
            errEl.textContent = "";
            btn.disabled = true;
            btn.textContent = "登录中...";

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem("admin_token", data.token);
                    localStorage.setItem("admin_user", data.username);
                    window.location.href = "dashboard.html";
                } else {
                    errEl.textContent = data.error || "登录失败";
                    btn.disabled = false;
                    btn.textContent = "登录";
                }
            } catch (err) {
                errEl.textContent = "网络错误，请重试";
                btn.disabled = false;
                btn.textContent = "登录";
            }
            return false;
        }
    </script>
</body>
</html>
