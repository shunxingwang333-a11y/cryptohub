<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>资讯管理 - CryptoHub 后台</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231652f0%22/><text x=%2216%22 y=%2222%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2218%22 font-weight=%22bold%22>C</text></svg>" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar-header">
                <div class="logo">
                    <span class="logo-icon">C</span>
                    CryptoHub
                </div>
            </div>
            <nav>
                <a href="dashboard.html"><span class="nav-icon">📊</span> 概览</a>
                <a href="dashboard.html" class="active"><span class="nav-icon">📄</span> 资讯管理</a>
                <a href="dashboard.html"><span class="nav-icon">📱</span> App 设置</a>
                <a href="/" target="_blank"><span class="nav-icon">🌐</span> 查看网站</a>
            </nav>
            <div class="admin-sidebar-footer">
                <a href="#" onclick="logout()"><span class="nav-icon">🚪</span> 退出登录</a>
            </div>
        </aside>

        <!-- Main -->
        <div class="admin-main">
            <header class="admin-header">
                <div class="admin-title">资讯管理</div>
                <div class="admin-user">
                    <span id="adminUsername">wladmin</span>
                    <span style="font-size:20px">👤</span>
                </div>
            </header>

            <div class="admin-content">
                <!-- Stats -->
                <div class="admin-stats">
                    <div class="admin-stat-card">
                        <div class="stat-label">资讯总数</div>
                        <div class="stat-value" id="statTotal">--</div>
                    </div>
                    <div class="admin-stat-card">
                        <div class="stat-label">已发布</div>
                        <div class="stat-value" id="statPublished" style="color:#16a34a">--</div>
                    </div>
                    <div class="admin-stat-card">
                        <div class="stat-label">草稿</div>
                        <div class="stat-value" id="statDraft" style="color:#d97706">--</div>
                    </div>
                    <div class="admin-stat-card">
                        <div class="stat-label">总阅读量</div>
                        <div class="stat-value" id="statViews">--</div>
                    </div>
                </div>

                <!-- News Table -->
                <div class="admin-card">
                    <div class="admin-card-header">
                        <h2>资讯列表</h2>
                        <button class="btn btn-primary" onclick="openCreateModal()">
                            <span>+</span> 新建资讯
                        </button>
                    </div>
                    <div class="admin-card-body" style="padding:0">
                        <div style="padding:12px 20px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--border)">
                            <input type="text" id="searchNews" placeholder="搜索标题..." style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;flex:1;max-width:300px" oninput="searchNewsList()" />
                            <select id="filterStatus" style="padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px" onchange="loadNewsList()">
                                <option value="">全部状态</option>
                                <option value="published">已发布</option>
                                <option value="draft">草稿</option>
                            </select>
                        </div>
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th style="width:40px">ID</th>
                                    <th>标题</th>
                                    <th style="width:80px">分类</th>
                                    <th style="width:80px">状态</th>
                                    <th style="width:80px">阅读量</th>
                                    <th style="width:140px">发布时间</th>
                                    <th style="width:140px">操作</th>
                                </tr>
                            </thead>
                            <tbody id="newsTableBody">
                                <tr><td colspan="7" style="text-align:center;padding:40px">加载中...</td></tr>
                            </tbody>
                        </table>
                        <div id="adminPagination" style="padding:12px 20px;display:flex;justify-content:center;gap:4px"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create/Edit Modal -->
    <div class="modal-overlay" id="newsModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">新建资讯</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="newsId" />
                <div class="form-row">
                    <label>标题</label>
                    <input type="text" id="newsTitle" placeholder="请输入资讯标题" />
                </div>
                <div class="form-row">
                    <label>摘要</label>
                    <textarea id="newsSummary" placeholder="一句话摘要" style="min-height:60px"></textarea>
                </div>
                <div class="form-row">
                    <label>正文内容</label>
                    <textarea id="newsContent" placeholder="请输入正文内容（支持多段，用换行分隔）" style="min-height:200px"></textarea>
                </div>
                <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px">
                    <div class="form-row">
                        <label>分类</label>
                        <select id="newsCategory">
                            <option value="btc">BTC</option>
                            <option value="eth">ETH</option>
                            <option value="sol">SOL</option>
                            <option value="xrp">XRP</option>
                            <option value="bnb">BNB</option>
                            <option value="defi">DeFi</option>
                            <option value="nft">NFT</option>
                            <option value="general">综合</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>来源</label>
                        <input type="text" id="newsSource" value="CryptoHub" />
                    </div>
                    <div class="form-row">
                        <label>状态</label>
                        <select id="newsStatus">
                            <option value="published">已发布</option>
                            <option value="draft">草稿</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn" onclick="closeModal()">取消</button>
                <button class="btn btn-primary" onclick="saveNews()" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <script>
        // Auth check
        const token = localStorage.getItem("admin_token");
        if (!token) {
            window.location.href = "index.html";
        }
        document.getElementById("adminUsername").textContent = localStorage.getItem("admin_user") || "admin";

        let currentPage = 1;
        let allNews = [];

        function logout() {
            localStorage.removeItem("admin_token");
            localStorage.removeItem("admin_user");
            window.location.href = "index.html";
        }

        async function loadStats() {
            try {
                const res = await fetch(`/api/admin/news?page=1&perPage=1000&token=${token}`);
                const data = await res.json();
                const news = data.items || [];
                document.getElementById("statTotal").textContent = news.length;
                document.getElementById("statPublished").textContent = news.filter(n => n.status === "published").length;
                document.getElementById("statDraft").textContent = news.filter(n => n.status === "draft").length;
                document.getElementById("statViews").textContent = news.reduce((s, n) => s + (n.views || 0), 0);
            } catch {}
        }

        async function loadNewsList(page = 1) {
            currentPage = page;
            const tbody = document.getElementById("newsTableBody");
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px">加载中...</td></tr>`;

            const status = document.getElementById("filterStatus").value;
            let url = `/api/admin/news?page=${page}&perPage=20&token=${token}`;
            if (status) url += `&status=${status}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                allNews = data.items || [];
                renderTable(allNews, data.total, data.perPage);
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--red)">加载失败: ${err.message}</td></tr>`;
            }
        }

        function renderTable(items, total, perPage) {
            const tbody = document.getElementById("newsTableBody");
            if (!items || items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-muted)">暂无资讯</td></tr>`;
                document.getElementById("adminPagination").innerHTML = "";
                return;
            }
            const catNames = { btc: "BTC", eth: "ETH", sol: "SOL", xrp: "XRP", bnb: "BNB", defi: "DeFi", nft: "NFT", general: "综合" };
            tbody.innerHTML = items.map(n => `
                <tr>
                    <td>${n.id}</td>
                    <td>
                        <div style="font-weight:500;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.title}</div>
                        <div style="font-size:12px;color:var(--text-muted);max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.summary}</div>
                    </td>
                    <td>${catNames[n.category] || n.category}</td>
                    <td><span class="status-badge ${n.status}">${n.status === "published" ? "已发布" : "草稿"}</span></td>
                    <td>${n.views || 0}</td>
                    <td style="font-size:12px;color:var(--text-muted)">${formatDate(n.publishedAt)}</td>
                    <td>
                        <button class="btn btn-sm" onclick="openEditModal(${n.id})">编辑</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteNews(${n.id}, '${n.title.replace(/'/g, "\\'")}')">删除</button>
                    </td>
                </tr>
            `).join("");

            // Pagination
            const pages = Math.ceil(total / perPage);
            const pagEl = document.getElementById("adminPagination");
            if (pages <= 1) { pagEl.innerHTML = ""; return; }
            let html = "";
            html += `<button class="btn btn-sm" ${currentPage === 1 ? "disabled" : ""} onclick="loadNewsList(${currentPage - 1})">上一页</button>`;
            for (let i = 1; i <= Math.min(pages, 10); i++) {
                html += `<button class="btn btn-sm ${i === currentPage ? 'btn-primary' : ''}" onclick="loadNewsList(${i})">${i}</button>`;
            }
            html += `<button class="btn btn-sm" ${currentPage >= pages ? "disabled" : ""} onclick="loadNewsList(${currentPage + 1})">下一页</button>`;
            pagEl.innerHTML = html;
        }

        function searchNewsList() {
            const q = document.getElementById("searchNews").value.toLowerCase();
            if (!q) { renderTable(allNews, allNews.length, 20); return; }
            const filtered = allNews.filter(n => n.title.toLowerCase().includes(q) || n.summary.toLowerCase().includes(q));
            renderTable(filtered, filtered.length, 20);
        }

        function openCreateModal() {
            document.getElementById("modalTitle").textContent = "新建资讯";
            document.getElementById("newsId").value = "";
            document.getElementById("newsTitle").value = "";
            document.getElementById("newsSummary").value = "";
            document.getElementById("newsContent").value = "";
            document.getElementById("newsCategory").value = "general";
            document.getElementById("newsSource").value = "CryptoHub";
            document.getElementById("newsStatus").value = "published";
            document.getElementById("newsModal").classList.add("show");
        }

        async function openEditModal(id) {
            try {
                const res = await fetch(`/api/news/${id}`);
                const n = await res.json();
                document.getElementById("modalTitle").textContent = "编辑资讯";
                document.getElementById("newsId").value = n.id;
                document.getElementById("newsTitle").value = n.title;
                document.getElementById("newsSummary").value = n.summary;
                document.getElementById("newsContent").value = n.content;
                document.getElementById("newsCategory").value = n.category;
                document.getElementById("newsSource").value = n.source;
                document.getElementById("newsStatus").value = n.status;
                document.getElementById("newsModal").classList.add("show");
            } catch (err) {
                alert("加载失败: " + err.message);
            }
        }

        function closeModal() {
            document.getElementById("newsModal").classList.remove("show");
        }

        async function saveNews() {
            const id = document.getElementById("newsId").value;
            const btn = document.getElementById("saveBtn");
            btn.disabled = true;
            btn.textContent = "保存中...";

            const data = {
                title: document.getElementById("newsTitle").value.trim(),
                summary: document.getElementById("newsSummary").value.trim(),
                content: document.getElementById("newsContent").value.trim(),
                category: document.getElementById("newsCategory").value,
                source: document.getElementById("newsSource").value.trim(),
                status: document.getElementById("newsStatus").value,
            };

            if (!data.title) {
                alert("请输入标题");
                btn.disabled = false;
                btn.textContent = "保存";
                return;
            }

            try {
                const isEdit = !!id;
                const url = isEdit ? `/api/admin/news/${id}?token=${token}` : `/api/admin/news?token=${token}`;
                const res = await fetch(url, {
                    method: isEdit ? "PUT" : "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data),
                });
                if (res.ok) {
                    closeModal();
                    loadNewsList(currentPage);
                    loadStats();
                } else {
                    const err = await res.json();
                    alert("保存失败: " + (err.error || "未知错误"));
                }
            } catch (err) {
                alert("网络错误: " + err.message);
            }
            btn.disabled = false;
            btn.textContent = "保存";
        }

        async function deleteNews(id, title) {
            if (!confirm(`确定删除"${title}"吗？此操作不可撤销。`)) return;
            try {
                const res = await fetch(`/api/admin/news/${id}?token=${token}`, { method: "DELETE" });
                if (res.ok) {
                    loadNewsList(currentPage);
                    loadStats();
                } else {
                    alert("删除失败");
                }
            } catch (err) {
                alert("网络错误: " + err.message);
            }
        }

        function formatDate(iso) {
            const d = new Date(iso);
            return d.getFullYear() + "-" + (d.getMonth()+1).toString().padStart(2,"0") + "-" + d.getDate().toString().padStart(2,"0") + " " + d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
        }

        // Close modal on overlay click
        document.getElementById("newsModal").addEventListener("click", (e) => {
            if (e.target.classList.contains("modal-overlay")) closeModal();
        });

        // Init
        loadStats();
        loadNewsList(1);
    </script>
</body>
</html>
