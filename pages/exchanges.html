<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>交易所 | CryptoHub</title>
    <meta name="description" content="全球加密货币交易所排名与数据" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231652f0%22/><text x=%2216%22 y=%2222%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2218%22 font-weight=%22bold%22>C</text></svg>" />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>

    <header class="header">
        <div class="header-inner">
            <a href="/" class="logo">
                <span class="logo-icon">C</span>
                CryptoHub
            </a>
            <nav class="nav">
                <a href="/">行情</a>
                <a href="/pages/exchanges.html" class="active">交易所</a>
                <a href="/pages/defi.html">DeFi</a>
                <a href="/pages/nft.html">NFT</a>
                <a href="/pages/news.html">资讯</a>
            </nav>
            <div class="header-actions">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="搜索币种..." autocomplete="off" />
                    <div class="search-results" id="searchResults"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="sub-page-header" style="margin: -24px -24px 24px; padding: 32px 24px;">
            <h1>交易所</h1>
            <p>全球加密货币交易所排名、交易量与评分数据</p>
            <div class="sub-page-stats">
                <div class="stat-card">
                    <div class="stat-label">交易所总数</div>
                    <div class="stat-value">928</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">24H 总交易量</div>
                    <div class="stat-value">¥5,820亿</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">活跃交易对</div>
                    <div class="stat-value">28,460</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">衍生品交易量占比</div>
                    <div class="stat-value">62%</div>
                </div>
            </div>
        </div>

        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="filter-tab active">全部</button>
                <button class="filter-tab">现货</button>
                <button class="filter-tab">衍生品</button>
                <button class="filter-tab">DEX</button>
            </div>
        </div>

        <div class="coin-table-wrap">
            <table class="exchange-table">
                <thead>
                    <tr>
                        <th style="width:50px">#</th>
                        <th>交易所</th>
                        <th>类型</th>
                        <th>24H成交量(¥)</th>
                        <th>交易对数</th>
                        <th>评分</th>
                        <th>状态</th>
                    </tr>
                </thead>
                <tbody id="exchangeBody">
                    <tr><td colspan="7" style="text-align:center;padding:60px"><div class="spinner" style="margin:0 auto 16px"></div>正在加载交易所数据...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span class="footer-text">数据来源：CoinGecko API | 仅供参考，不构成投资建议</span>
            <div class="footer-links">
                <a href="/">关于</a>
                <a href="/">API</a>
                <a href="/">免责声明</a>
            </div>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script>
        const exchanges = [
            { name: "Binance", logo: "B", color: "#f0b90b", type: "现货+衍生品", vol: "1,920亿", pairs: "1,840", score: "A+" },
            { name: "Coinbase Exchange", logo: "C", color: "#0052ff", type: "现货", vol: "486亿", pairs: "420", score: "A" },
            { name: "OKX", logo: "O", color: "#000000", type: "现货+衍生品", vol: "380亿", pairs: "620", score: "A" },
            { name: "Bybit", logo: "B", color: "#f7a600", type: "现货+衍生品", vol: "350亿", pairs: "580", score: "A" },
            { name: "Gate.io", logo: "G", color: "#2354e6", type: "现货+衍生品", vol: "120亿", pairs: "1,420", score: "A-" },
            { name: "Bitget", logo: "B", color: "#00f0ff", type: "现货+衍生品", vol: "98亿", pairs: "460", score: "A-" },
            { name: "MEXC", logo: "M", color: "#1972ff", type: "现货+衍生品", vol: "76亿", pairs: "2,840", score: "B+" },
            { name: "Kraken", logo: "K", color: "#5841d8", type: "现货", vol: "65亿", pairs: "320", score: "A" },
            { name: "Uniswap (V3)", logo: "U", color: "#ff007a", type: "DEX", vol: "52亿", pairs: "3,200", score: "A" },
            { name: "HTX", logo: "H", color: "#1a237e", type: "现货+衍生品", vol: "38亿", pairs: "840", score: "B+" },
            { name: "KuCoin", logo: "K", color: "#24ae8f", type: "现货+衍生品", vol: "32亿", pairs: "760", score: "B+" },
            { name: "PancakeSwap", logo: "P", color: "#d1884f", type: "DEX", vol: "28亿", pairs: "4,820", score: "A-" },
            { name: "Bitfinex", logo: "B", color: "#16b157", type: "现货", vol: "22亿", pairs: "180", score: "B+" },
            { name: "Crypto.com", logo: "C", color: "#0d3fd4", type: "现货+衍生品", vol: "18亿", pairs: "340", score: "B+" },
            { name: "BingX", logo: "B", color: "#fcab24", type: "现货+衍生品", vol: "15亿", pairs: "420", score: "B" },
        ];

        function renderExchanges() {
            const tbody = document.getElementById("exchangeBody");
            tbody.innerHTML = exchanges.map((ex, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td>
                        <div class="exchange-info">
                            <div class="exchange-logo" style="background:${ex.color}22;color:${ex.color}">${ex.logo}</div>
                            <div>
                                <div style="font-weight:600">${ex.name}</div>
                                <div style="font-size:12px;color:var(--text-muted)">${ex.type}</div>
                            </div>
                        </div>
                    </td>
                    <td>${ex.type}</td>
                    <td>¥${ex.vol}</td>
                    <td>${ex.pairs}</td>
                    <td><span class="pct-badge up">${ex.score}</span></td>
                    <td><span style="color:var(--green);font-weight:600">● 正常运营</span></td>
                </tr>
            `).join("");
        }
        renderExchanges();

        // Search
        const input = document.getElementById("searchInput");
        const results = document.getElementById("searchResults");
        let timer = null;
        input.addEventListener("input", (e) => {
            const q = e.target.value.trim();
            clearTimeout(timer);
            if (!q) { results.classList.remove("show"); return; }
            timer = setTimeout(async () => {
                try {
                    const coins = await API.search(q);
                    if (coins.length === 0) {
                        results.innerHTML = `<div class="search-result-item" style="color:var(--text-muted)">无搜索结果</div>`;
                    } else {
                        results.innerHTML = coins.map(c => `
                            <div class="search-result-item" onclick="window.location.href='/detail.html?id=${c.id}'">
                                ${c.thumb ? `<img src="${c.thumb}" alt="${c.name}" onerror="this.style.display='none'" />` : ""}
                                <span class="sr-symbol">${c.symbol}</span>
                                <span class="sr-name">${c.name}</span>
                            </div>
                        `).join("");
                    }
                    results.classList.add("show");
                } catch {}
            }, 400);
        });
        document.addEventListener("click", (e) => {
            if (!e.target.closest(".search-box")) results.classList.remove("show");
        });
    </script>
</body>
</html>
